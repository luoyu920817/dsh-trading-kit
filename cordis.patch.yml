# dsh-trader-kit bundle patch
#
# 装配语义沿 DSH-better-sidebar 的 bundle patch 先例：宿主经 profile bundles
# （`dsh plugin --profile <name> add dsh-trader-kit` 的 file:/本地渠道，或 profile
# 自身 cordis.patch.yml 的手工挂载行）合并本 patch 后，`dsh-trader-kit` 作为
# cordis 插件行进入插件树。
#
# 个人工程、单实例挂载：不需要 better-sidebar 那种聚合双挂载守卫表达式。
#
# config 段（change 2 data-foundation 首次落地 `src/config.ts` 后生效）：
# 只写占位符/注释示例——MUST NOT 写个人 vault 绝对路径，MUST NOT 写签章现值；
# 本机实例路径与本机签章走 profile 层或本文件注释示例（<...> 为占位符）：
#
#   - insert:
#       - id: trader-kit
#         name: 'dsh-trader-kit'
#         config:
#           dataRoot: '<你的 vault 数据根>'          # 例：<数据根>（含 DB/review、agent/skills）
#           sources:                                 # S7 sign/ts 等源参数走 profile 层
#             s7:
#               sign: '<S7 sign 占位>'
#               ts: '<S7 ts 占位>'
#           skill:
#             installDir: '<可选：绝对安装根，缺省取 <项目根>/.dsh/skills>'
#
# 当前（change 2 配置面未落地）不写 config 段——插件以默认值挂载。
- insert:
    - id: trader-kit
      name: 'dsh-trader-kit'
